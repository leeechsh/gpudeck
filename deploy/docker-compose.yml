services:
  secrets-init:
    image: alpine:3.22
    restart: "no"
    volumes: [gpudeck-secrets:/secrets]
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        test -s /secrets/postgres_password || head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/postgres_password
        test -s /secrets/admin_password || head -c 24 /dev/urandom | base64 > /secrets/admin_password
        chown 65532:65532 /secrets/postgres_password /secrets/admin_password
        chmod 0400 /secrets/postgres_password /secrets/admin_password
  gpudeck-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gpudeck
      POSTGRES_USER: gpudeck
      POSTGRES_PASSWORD_FILE: /run/gpudeck-secrets/postgres_password
    volumes:
      - gpudeck-postgres:/var/lib/postgresql/data
      - gpudeck-secrets:/run/gpudeck-secrets:ro
    depends_on:
      secrets-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpudeck"]
      interval: 10s
      timeout: 5s
      retries: 10
  gpudeck-hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.hub
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      GPUDECK_BOOTSTRAP_PASSWORD_FILE: /run/gpudeck-secrets/admin_password
    volumes:
      - gpudeck-secrets:/run/gpudeck-secrets:ro
    depends_on:
      gpudeck-postgres: { condition: service_healthy }
  gpudeck-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      GPUDECK_SITE_ADDRESS: ${GPUDECK_SITE_ADDRESS:-http://:80}
    ports: ["${GPUDECK_BIND_ADDRESS:-127.0.0.1}:${GPUDECK_HTTP_PORT:-37935}:80"]
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [gpudeck-hub]
volumes:
  gpudeck-postgres:
  gpudeck-secrets:
  caddy-data:
  caddy-config:
