services:
  secrets-init:
    image: alpine:3.22
    restart: "no"
    volumes: [gpudeck-secrets:/secrets]
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        test -s /secrets/admin_password || head -c 24 /dev/urandom | base64 > /secrets/admin_password
        chown 65532:65532 /secrets/admin_password
        chmod 0400 /secrets/admin_password
  data-init:
    image: alpine:3.22
    restart: "no"
    volumes: ["gpudeck-data:/data"]
    command: ["/bin/sh", "-ec", "chown -R 65532:65532 /data; chmod 0700 /data; find /data -type f -exec chmod 0600 '{}' ';'"]
    depends_on:
      secrets-init: { condition: service_completed_successfully }
  gpudeck-hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.hub
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      GPUDECK_BOOTSTRAP_PASSWORD_FILE: /run/gpudeck-secrets/admin_password
      DATABASE_URL: sqlite:///data/gpudeck.sqlite
    volumes:
      - gpudeck-secrets:/run/gpudeck-secrets:ro
      - gpudeck-data:/data
    depends_on:
      secrets-init: { condition: service_completed_successfully }
      data-init: { condition: service_completed_successfully }
  gpudeck-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      GPUDECK_SITE_ADDRESS: ${GPUDECK_SITE_ADDRESS:-http://:80}
    ports: ["${GPUDECK_BIND_ADDRESS:-127.0.0.1}:${GPUDECK_HTTP_PORT:-37935}:80"]
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [gpudeck-hub]
volumes:
  gpudeck-data:
  gpudeck-secrets:
  caddy-data:
  caddy-config:
